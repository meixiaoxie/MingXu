name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release-check:
    name: Release gate on Node 24 / Ubuntu
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      - name: Check out repository
        # actions/checkout v4
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        # pnpm/action-setup v4
        uses: pnpm/action-setup@fe02b2b198060655c91e734aa9d15097341251d0
        with:
          run_install: false

      - name: Set up Node.js
        # actions/setup-node v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check source and tests
        run: pnpm typecheck

      - name: Run fast tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Run package smoke
        run: pnpm test:smoke

      - name: Dry-run package contents
        run: pnpm pack:dry-run

      - name: Publish package with provenance
        run: npm publish --provenance --access public
